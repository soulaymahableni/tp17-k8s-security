apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Requests et limits obligatoires
    policies.kyverno.io/severity: medium
spec:
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["tp17"]
      validate:
        failureAction: Audit
        message: "Chaque conteneur doit définir requests.cpu, requests.memory et limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
