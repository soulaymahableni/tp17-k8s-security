# Policy modèle : images taggées obligatoires, tag "latest" interdit.
# Partie 5 : d'abord en Audit (rapports), puis Enforce (refus à l'admission).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Interdire le tag latest
    policies.kyverno.io/severity: medium
spec:
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["tp17"]
      validate:
        failureAction: Audit
        message: "Chaque image doit avoir un tag explicite."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["tp17"]
      validate:
        failureAction: Audit
        message: "Le tag 'latest' est interdit : utilisez une version précise."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
