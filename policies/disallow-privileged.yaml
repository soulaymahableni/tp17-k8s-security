apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Pas de conteneur privilégié
    policies.kyverno.io/severity: high
spec:
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["tp17"]
      validate:
        failureAction: Audit
        message: "Les conteneurs privilégiés sont interdits (securityContext.privileged doit être false ou absent)."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
