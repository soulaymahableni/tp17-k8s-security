# Défi : la règle "pas de latest" en Rego avec OPA Gatekeeper
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatest
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatest
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatest

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("Image %v : le tag latest est interdit", [c.image])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not contains(c.image, ":")
          msg := sprintf("Image %v : tag explicite obligatoire", [c.image])
        }
