# Partie 1 : moindre privilège pour l'API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: tp17
automountServiceAccountToken: false
---
# TODO complété : lecture seule des ConfigMaps du namespace tp17
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: tp17
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-sa-configmap-reader
  namespace: tp17
subjects:
  - kind: ServiceAccount
    name: api-sa
    namespace: tp17
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-reader
